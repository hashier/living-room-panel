        - label: { text: "CO₂", align: TOP_MID, x: -150, y: 244 }
        - label: { id: st_co2, text: "--", styles: muted, align: TOP_MID, x: -150, y: 274 }
        # Fine dust gauge
        - arc:
            id: arc_pm25
            align: TOP_MID
            x: 0
            y: 96
            width: 136
            height: 136
            min_value: 0
            max_value: 100
            value: 0
            start_angle: 135
            end_angle: 45
            arc_width: 12
            arc_color: 0x1B2129
            arc_rounded: true
            bg_opa: TRANSP
            clickable: false
            indicator:
              arc_width: 12
              arc_color: 0x8A94A6
              arc_rounded: true
            knob:
              bg_opa: TRANSP
        - label: { id: val_pm25, text: "--", text_font: f_title, align: TOP_MID, x: 0, y: 140 }
        - label: { text: "µg/m³", styles: muted, text_font: montserrat_16, align: TOP_MID, x: 0, y: 180 }
        - label: { text: "Fine dust", align: TOP_MID, x: 0, y: 244 }
        - label: { id: st_pm25, text: "--", styles: muted, align: TOP_MID, x: 0, y: 274 }
        # Humidity gauge
        - arc:
            id: arc_hum
            align: TOP_MID
            x: 150
            y: 96
            width: 136
            height: 136
            min_value: 0
            max_value: 100
            value: 0
            start_angle: 135
            end_angle: 45
            arc_width: 12
            arc_color: 0x1B2129
            arc_rounded: true
            bg_opa: TRANSP
            clickable: false
            indicator:
              arc_width: 12
              arc_color: 0x8A94A6
              arc_rounded: true
            knob:
              bg_opa: TRANSP
        - label: { id: val_hum, text: "--", text_font: f_title, align: TOP_MID, x: 150, y: 140 }
        - label: { text: "%", styles: muted, text_font: montserrat_16, align: TOP_MID, x: 150, y: 180 }
        - label: { text: "Humidity", align: TOP_MID, x: 150, y: 244 }
        - label: { id: st_hum, text: "--", styles: muted, align: TOP_MID, x: 150, y: 274 }
        # Summary card
        - obj:
            styles: card
            align: TOP_MID
            y: 336
            width: 440
            height: 96
            scrollable: false
            widgets:
              - label: { id: lbl_air_summary, text: "Waiting for data", text_font: f_title, align: CENTER }

    # ---------------------------------------------------------------- Lights
    - id: lights
      styles: page_style
      scrollable: false
      on_load:
        - lambda: |-
            id(page_select).publish_state("Lights");
            lv_obj_t *dots[] = {id(dot_heating), id(dot_air), id(dot_lights), id(dot_screen)};
            for (int i = 0; i < 4; i++) lv_obj_set_style_bg_color(dots[i], lv_color_hex(i == 2 ? 0xF2F4F7 : 0x3A4350), LV_PART_MAIN);
      on_swipe_left:
        # A swipe ends this touch: LVGL sends PRESS_LOST to the button under the finger
        # and no click on release (lv_indev.c, LVGL 9.5)
        - lambda: lv_indev_wait_release(lv_indev_active());
        - lvgl.page.next: { animation: MOVE_LEFT, time: 300ms }
      on_swipe_right:
        - lambda: lv_indev_wait_release(lv_indev_active());
        - lvgl.page.previous: { animation: MOVE_RIGHT, time: 300ms }
      widgets:
        - label: { text: "Lights", styles: page_title }
        - obj:
            align: TOP_MID
            y: 84
            width: 440
            height: 356
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: grid
              grid_rows: [FR(1), FR(1), FR(1)]
              grid_columns: [FR(1), FR(1)]
              pad_row: 12
              pad_column: 12
            widgets:
              - button:
                  id: btn_win_left
                  styles: card
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  checked:
                    bg_color: 0xF5B942
                    text_color: 0x1B2129
                  widgets:
                    - label: { text: "\U000F0335", text_font: f_icons, align: TOP_LEFT, x: 18, y: 14 }
                    - label: { text: "Left window", align: BOTTOM_LEFT, x: 18, y: -14 }
                  on_click:
                    - homeassistant.action:
                        action: homeassistant.toggle
                        data:
                          entity_id: switch.window_light_left_plug_switch
              - button:
                  id: btn_center
                  styles: card
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  checked:
                    bg_color: 0xF5B942
                    text_color: 0x1B2129
                  widgets:
                    - label: { text: "\U000F0335", text_font: f_icons, align: TOP_LEFT, x: 18, y: 14 }
                    - label: { text: "Center", align: BOTTOM_LEFT, x: 18, y: -14 }
                  on_click:
                    - homeassistant.action:
                        action: homeassistant.toggle
                        data:
                          entity_id: switch.smartplug_max_1kw_switch_2
              - button:
                  id: btn_win_right
                  styles: card
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  checked:
                    bg_color: 0xF5B942
                    text_color: 0x1B2129
                  widgets:
                    - label: { text: "\U000F0335", text_font: f_icons, align: TOP_LEFT, x: 18, y: 14 }
                    - label: { text: "Right window", align: BOTTOM_LEFT, x: 18, y: -14 }
                  on_click:
                    - homeassistant.action:
                        action: homeassistant.toggle
                        data:
                          entity_id: switch.window_light_right_plug_switch_2
              - button:
                  id: btn_sofa
                  styles: card
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  checked:
                    bg_color: 0xF5B942
                    text_color: 0x1B2129
                  widgets:
                    - label: { text: "\U000F04B9", text_font: f_icons, align: TOP_LEFT, x: 18, y: 14 }
                    - label: { text: "Sofa", align: BOTTOM_LEFT, x: 18, y: -14 }
                  on_click:
                    - homeassistant.action:
                        action: homeassistant.toggle
                        data:
                          entity_id: light.sofalight
              # Switches the four lights one by one, not the ZHA group: group commands left
              # Home Assistant with stale member states. Off if any is on, otherwise on.
              - button:
                  id: btn_all
                  styles: card
                  grid_cell_row_pos: 2
                  grid_cell_column_pos: 0
                  grid_cell_column_span: 2
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  checked:
                    bg_color: 0xF5B942
                    text_color: 0x1B2129
                  widgets:
                    - label: { text: "\U000F1253", text_font: f_icons, align: TOP_LEFT, x: 18, y: 14 }
                    - label: { text: "All lights", align: BOTTOM_LEFT, x: 18, y: -14 }
                  on_click:
                    - if:
                        condition:
                          lambda: return id(st_win_left).state || id(st_center).state || id(st_win_right).state || id(st_sofa).state;
                        then:
                          - homeassistant.action:
                              action: homeassistant.turn_off
                              data:
                                entity_id: switch.window_light_left_plug_switch, switch.smartplug_max_1kw_switch_2, switch.window_light_right_plug_switch_2, light.sofalight
                        else:
                          - homeassistant.action:
                              action: homeassistant.turn_on
                              data:
                                entity_id: switch.window_light_left_plug_switch, switch.smartplug_max_1kw_switch_2, switch.window_light_right_plug_switch_2, light.sofalight
    # ---------------------------------------------------------------- Screen
    - id: screen
      styles: page_style
      scrollable: false
      on_load:
        - lambda: |-
            id(page_select).publish_state("Screen");
            lv_obj_t *dots[] = {id(dot_heating), id(dot_air), id(dot_lights), id(dot_screen)};
            for (int i = 0; i < 4; i++) lv_obj_set_style_bg_color(dots[i], lv_color_hex(i == 3 ? 0xF2F4F7 : 0x3A4350), LV_PART_MAIN);
      on_swipe_left:
        # A swipe ends this touch: LVGL sends PRESS_LOST to the button under the finger
        # and no click on release (lv_indev.c, LVGL 9.5)
        - lambda: lv_indev_wait_release(lv_indev_active());
        - lvgl.page.next: { animation: MOVE_LEFT, time: 300ms }
      on_swipe_right:
        - lambda: lv_indev_wait_release(lv_indev_active());
        - lvgl.page.previous: { animation: MOVE_RIGHT, time: 300ms }
      widgets:
        - label: { text: "Screen", styles: page_title }
        # Settings card, one row every 72 px
        - obj:
            styles: card
            align: TOP_MID
            y: 76
            width: 440
            height: 368
            scrollable: false
            widgets:
              # Brightness
              - label: { text: "Brightness", align: TOP_LEFT, x: 22, y: 26 }
              # Minimum 5% so the slider can't black out the screen with no way back except Home Assistant
              - slider:
                  id: sld_brightness
                  align: TOP_RIGHT
                  x: -30
                  y: 30
                  width: 200
                  height: 14
                  min_value: 5
                  max_value: 100
                  value: 100
                  styles: settings_slider
                  indicator:
                    bg_color: 0xF5B942
                  knob:
                    bg_color: 0xF2F4F7
                    pad_all: 8
                  # Otherwise dragging the knob also counts as a page swipe, and the page change
                  # releases the slider early at the low value where the drag started
                  gesture_bubble: false
                  on_release:
                    - globals.set: { id: dimmed, value: "false" }
                    - light.turn_on:
                        id: display_backlight
                        brightness: !lambda return x / 100.0;
              # Dim brightness
              - label: { text: "Dim to", align: TOP_LEFT, x: 22, y: 98 }
              - slider:
                  id: sld_dim
                  align: TOP_RIGHT
                  x: -30
                  y: 102
                  width: 200
                  height: 14
                  min_value: 5
                  max_value: 100
                  value: 20
                  styles: settings_slider
                  indicator:
                    bg_color: 0xF5B942
                  knob:
                    bg_color: 0xF2F4F7
                    pad_all: 8
                  gesture_bubble: false
                  on_release:
                    - number.set:
                        id: dim_level
                        value: !lambda return x;
              # Dim after
              - label: { text: "Dim after", align: TOP_LEFT, x: 22, y: 170 }
              - button:
                  styles: small_round_btn
                  align: TOP_RIGHT
                  x: -150
                  y: 156
                  widgets:
                    - label: { align: CENTER, text: "\U000F0374", text_font: f_icons }
                  on_click:
                    - number.decrement: dim_after
              - label: { id: lbl_dim_after, text: "--", align: TOP_RIGHT, x: -76, y: 170, width: 70, text_align: CENTER }
              - button:
                  styles: small_round_btn
                  align: TOP_RIGHT
                  x: -20
                  y: 156
                  widgets:
                    - label: { align: CENTER, text: "\U000F0415", text_font: f_icons }
                  on_click:
                    - number.increment: dim_after
              # Screen off after dimming
              - label: { text: "Off after", align: TOP_LEFT, x: 22, y: 242 }
              - button:
                  styles: small_round_btn
                  align: TOP_RIGHT
                  x: -150
                  y: 228
                  widgets:
                    - label: { align: CENTER, text: "\U000F0374", text_font: f_icons }
                  on_click:
                    - number.decrement: off_after_dim
              - label: { id: lbl_off_after, text: "--", align: TOP_RIGHT, x: -76, y: 242, width: 70, text_align: CENTER }
              - button:
                  styles: small_round_btn
                  align: TOP_RIGHT
                  x: -20
                  y: 228
                  widgets:
                    - label: { align: CENTER, text: "\U000F0415", text_font: f_icons }
                  on_click:
                    - number.increment: off_after_dim
              # Screen saver on/off
              - label: { text: "Screen saver", align: TOP_LEFT, x: 22, y: 314 }
              - switch:
                  id: sw_saver
                  align: TOP_RIGHT
                  x: -24
                  y: 306
                  width: 72
                  height: 38
                  bg_color: 0x2A323D
                  indicator:
                    checked:
                      bg_color: 0xF5B942
                  knob:
                    bg_color: 0xF2F4F7
                  on_change:
                    - if:
                        condition:
                          lambda: return x;
                        then:
                          - switch.turn_on: screensaver_enabled
                        else:
                          - switch.turn_off: screensaver_enabled
