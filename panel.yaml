esphome:
  name: "guition-esp32-s3-4848s040"
  friendly_name: "4848s040"

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin: # prevent screen flickering during OTA
      - light.turn_off:
          id: display_backlight
          transition_length: 0s
      - lambda: "id(display_backlight).loop();"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO38
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    name: Backlight
    id: display_backlight
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 1s
    # Turning the backlight on from Home Assistant must also resume LVGL: while paused,
    # ESPHome skips the idle check (LvglComponent::update), so the screen saver would never fire again
    on_turn_on:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
    # Keep the panel slider in step when brightness is changed from Home Assistant
    on_state:
      - if:
          condition:
            lambda: return id(display_backlight).remote_values.is_on() && !id(dimmed);
          then:
            - lvgl.slider.update:
                id: sld_brightness
                value: !lambda return id(display_backlight).remote_values.get_brightness() * 100;
            - component.update: brightness_number

spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

i2c:
  id: touchscreen_bus
  sda: GPIO19
  scl:
    number: 45
    ignore_strapping_warning: true

display:
  - platform: st7701s
    id: tft_display
    dimensions:
      width: 480
      height: 480
    #    rotation: 270    #uncomment for placement with down-facing USB socket
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: False
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    pclk_frequency: 12MHz
    pclk_inverted: False
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    update_interval: never
    auto_clear_enabled: False
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10] # CMD2_BKSEL_BK0
      - [0xCD, 0x00] # disable MDT flag
    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]

touchscreen:
  - platform: gt911
    id: tft_touch
    display: tft_display
    # Default 50ms polling leaves LVGL (16ms ticks) seeing zero movement on most reads,
    # which resets its gesture distance, so swipes never register
    update_interval: 16ms
    # The GT911 already reports screen pixels (corner taps gave raw x 9-453, y 18-479), but
    # without this ESPHome scaled them down again, so touches landed at about 0.45x / 0.8x
    calibration:
      x_min: 0
      x_max: 480
      y_min: 0
      y_max: 480
#    transform:     #uncomment for placement with down-facing USB socket
#      swap_xy: true
#      mirror_x: true
    # Any touch on the dimmed (not paused) screen brings back full brightness
    on_touch:
      - if:
          condition:
            lambda: return id(dimmed) && !id(lvgl_comp).is_paused();
          then:
            - script.execute: restore_brightness
    # Wake from the screen saver; while LVGL is paused the tap reaches no widget
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - script.execute: restore_brightness

number:
  # Idle stages: full brightness -> dim after "Dim after" -> off after another "Screen off after dimming"
  - platform: template
    name: Dim after
    id: dim_after
    optimistic: true
    unit_of_measurement: "min"
    initial_value: 3
    restore_value: true
    min_value: 1
    max_value: 60
    step: 1
  - platform: template
    name: Screen off after dimming
    id: off_after_dim
    optimistic: true
    unit_of_measurement: "min"
    initial_value: 10
    restore_value: true
    min_value: 1
    max_value: 120
    step: 1
  - platform: template
    name: Dim brightness
    id: dim_level
    optimistic: true
    unit_of_measurement: "%"
    initial_value: 20
    restore_value: true
    min_value: 5
    max_value: 100
    step: 5
  # Shows as a slider on the device page; the Backlight light only offers brightness in its popup
  - platform: template
    name: Screen brightness
    id: brightness_number
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    lambda: return id(display_backlight).remote_values.get_brightness() * 100;
    update_interval: never
    set_action:
      - globals.set: { id: dimmed, value: "false" }
      - light.turn_on:
          id: display_backlight
          brightness: !lambda return x / 100.0;

globals:
  # Set while the idle dim stage is active, so the next touch restores the user's brightness
  - id: dimmed
    type: bool
    initial_value: "false"
  - id: saved_brightness
    type: float
    initial_value: "1.0"

script:
  - id: restore_brightness
    then:
      - if:
          condition:
            lambda: return id(dimmed);
          then:
            - globals.set: { id: dimmed, value: "false" }
            - light.turn_on:
                id: display_backlight
                brightness: !lambda return id(saved_brightness);
          else:
            - light.turn_on: display_backlight


# Living room values from the air quality monitor, pulled through Home Assistant
sensor:
  - platform: homeassistant
    id: lr_temp
    entity_id: sensor.air_quality_monitor_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_temp
          text:
            format: "%.1f °C"
            args: [x]
            if_nan: "--"
  - platform: homeassistant
    id: lr_co2
    entity_id: sensor.air_quality_monitor_co2
    on_value:
      - lvgl.label.update:
          id: lbl_co2
          text:
            format: "%.0f ppm"
            args: [x]
            if_nan: "--"
  - platform: homeassistant
    id: lr_pm25
    entity_id: sensor.air_quality_monitor_pm_2_5
    on_value:
      - lvgl.label.update:
          id: lbl_pm25
          text:
            format: "%.1f ug/m3"
            args: [x]
            if_nan: "--"
  # ATC 5977 is the thermostat's own target_sensor
  - platform: homeassistant
    id: room_temp
    entity_id: sensor.atc_5977_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_room
          text:
            format: "%.1f °C"
            args: [x]
            if_nan: "--"
  # The setpoint the thermostat really uses; the automation copies sensor.desired_temperature here every 5 min
  - platform: homeassistant
    id: target_temp
    entity_id: climate.living_room
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: lbl_target
          text:
            format: "%.1f °C"
            args: [x]
            if_nan: "--"
  - platform: homeassistant
    id: target_offset
    entity_id: input_number.adjust_desired_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_offset
          text:
            format: "%+.1f"
            args: [x]
            if_nan: "--"
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
  - platform: uptime
    name: Uptime

text_sensor:
  - platform: homeassistant
    id: heating_action
    entity_id: climate.living_room
    attribute: hvac_action
    on_value:
      - if:
          condition:
            lambda: return x == "heating";
          then:
            - lvgl.label.update:
                id: lbl_status
                text: "Heating"
                text_color: 0xFF8C00
          else:
            - lvgl.label.update:
                id: lbl_status
                text: "Idle"
                text_color: 0x808080

button:
  - platform: restart
    name: Restart

switch:
  - platform: template
    name: Screen saver
    id: screensaver_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# Shows which page is on screen and switches it from Home Assistant
select:
  - platform: template
    name: Page
    id: page_select
    options: [Heating, Air, Lights, Screen]
    initial_option: Heating
    set_action:
      - if:
          condition:
            lambda: return x == "Screen";
          then:
            - lvgl.page.show: screen
      - if:
          condition:
            lambda: return x == "Air";
          then:
            - lvgl.page.show: living_room
      - if:
          condition:
            lambda: return x == "Lights";
          then:
            - lvgl.page.show: lights
      - if:
          condition:
            lambda: return x == "Heating";
          then:
            - lvgl.page.show: heating

# Light states from Home Assistant, so the buttons show on/off even when switched elsewhere
binary_sensor:
  - platform: homeassistant
    id: st_sofa
    entity_id: light.sofalight
    publish_initial_state: true
    on_state:
      - lvgl.widget.update:
          id: btn_sofa
          state:
            checked: !lambda return x;
  - platform: homeassistant
    id: st_win_left
    entity_id: switch.window_light_left_plug_switch
    publish_initial_state: true
    on_state:
      - lvgl.widget.update:
          id: btn_win_left
          state:
            checked: !lambda return x;
      - lvgl.widget.update:
          id: btn_windows
          state:
            checked: !lambda return id(st_win_left).state || id(st_win_right).state;
  - platform: homeassistant
    id: st_win_right
    entity_id: switch.window_light_right_plug_switch_2
    publish_initial_state: true
    on_state:
      - lvgl.widget.update:
          id: btn_win_right
          state:
            checked: !lambda return x;
      - lvgl.widget.update:
          id: btn_windows
          state:
            checked: !lambda return id(st_win_left).state || id(st_win_right).state;
  - platform: homeassistant
    id: st_all
    entity_id: switch.silicon_labs_ezsp_living_room_lights_group
    publish_initial_state: true
    on_state:
      - lvgl.widget.update:
          id: btn_all
          state:
            checked: !lambda return x;

# The built-in Montserrat fonts only have ASCII plus the degree sign, so "CO2" and "ug/m3" instead of subscript and µ
lvgl:
  id: lvgl_comp
  on_idle:
    - timeout: !lambda "return id(dim_after).state * 60000;"
      then:
        - if:
            condition:
              lambda: return id(screensaver_enabled).state && id(display_backlight).remote_values.is_on();
            then:
              - logger.log: "Screen dimmed"
              - lambda: id(saved_brightness) = id(display_backlight).remote_values.get_brightness();
              - globals.set: { id: dimmed, value: "true" }
              - light.turn_on:
                  id: display_backlight
                  brightness: !lambda return id(dim_level).state / 100.0;
    - timeout: !lambda "return (id(dim_after).state + id(off_after_dim).state) * 60000;"
      then:
        - if:
            condition:
              switch.is_on: screensaver_enabled
            then:
              - logger.log: "Screen saver on"
              - light.turn_off: display_backlight
              - lvgl.pause:
  pages:
    - id: heating
      # Stack items in the middle with fixed gaps; "vertical" spread them over the full height
      layout:
        type: flex
        flex_flow: column
        flex_align_main: center
        flex_align_cross: center
        pad_row: 16
      on_load:
        - lambda: id(page_select).publish_state("Heating");
      on_swipe_left:
        - lvgl.page.next:
            animation: MOVE_LEFT
            time: 300ms
      on_swipe_right:
        - lvgl.page.previous:
            animation: MOVE_RIGHT
            time: 300ms
      widgets:
        - label: { id: lbl_status, text: "--", text_font: montserrat_28 }
        # Room and target side by side
        # Fixed heights: with SIZE_CONTENT on both levels the row rendered 0 px tall
        - obj:
            width: 100%
            height: 110
            border_width: 0
            bg_opa: TRANSP
            pad_all: 0
            scrollable: false
            layout: horizontal
            widgets:
              - obj:
                  width: 48%
                  height: 100%
                  border_width: 0
                  bg_opa: TRANSP
                  pad_all: 0
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                    flex_align_cross: center
                    pad_row: 4
                  widgets:
                    - label: { text: "Room", text_font: montserrat_20 }
                    - label: { id: lbl_room, text: "--", text_font: montserrat_32 }
              - obj:
                  width: 48%
                  height: 100%
                  border_width: 0
                  bg_opa: TRANSP
                  pad_all: 0
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                    flex_align_cross: center
                    pad_row: 4
                  widgets:
                    - label: { text: "Target", text_font: montserrat_20 }
                    - label: { id: lbl_target, text: "--", text_font: montserrat_32 }
        - label: { text: "Adjustment", text_font: montserrat_20 }
        - obj:
            width: 100%
            height: SIZE_CONTENT
            border_width: 0
            bg_opa: TRANSP
            pad_all: 0
            scrollable: false
            layout: horizontal
            widgets:
              - button:
                  width: 80
                  height: 80
                  scrollable: false
                  widgets:
                    - label: { align: CENTER, text: "-", text_font: montserrat_40 }
                  on_click:
                    - homeassistant.action:
                        action: input_number.decrement
                        data:
                          entity_id: input_number.adjust_desired_temperature
              - label: { id: lbl_offset, text: "--", text_font: montserrat_48 }
              - button:
                  width: 80
                  height: 80
                  scrollable: false
                  widgets:
                    - label: { align: CENTER, text: "+", text_font: montserrat_40 }
                  on_click:
                    - homeassistant.action:
                        action: input_number.increment
                        data:
                          entity_id: input_number.adjust_desired_temperature
    - id: living_room
      layout: vertical
      # publish_state only reports the page; it doesn't run set_action again
      on_load:
        - lambda: id(page_select).publish_state("Air");
      on_swipe_right:
        - lvgl.page.previous:
            animation: MOVE_RIGHT
            time: 300ms
      on_swipe_left:
        - lvgl.page.next:
            animation: MOVE_LEFT
            time: 300ms
      widgets:
        - label:
            text: "Living room"
            text_font: montserrat_28
        - label:
            text: "Temperature"
            text_font: montserrat_20
        - label:
            id: lbl_temp
            text: "--"
            text_font: montserrat_48
        - label:
            text: "CO2"
            text_font: montserrat_20
        - label:
            id: lbl_co2
            text: "--"
            text_font: montserrat_48
        - label:
            text: "PM2.5"
            text_font: montserrat_20
        - label:
            id: lbl_pm25
            text: "--"
            text_font: montserrat_48
    - id: lights
      layout: 3x2
      on_load:
        - lambda: id(page_select).publish_state("Lights");
      on_swipe_left:
        - lvgl.page.next:
            animation: MOVE_LEFT
            time: 300ms
      on_swipe_right:
        - lvgl.page.previous:
            animation: MOVE_RIGHT
            time: 300ms
      widgets:
        # Both window lights together: off if either is on, otherwise on
        - button:
            id: btn_windows
            width: 200
            height: 130
            checkable: true
            widgets:
              - label: { align: CENTER, text: "Windows", text_font: montserrat_28 }
            on_click:
              - if:
                  condition:
                    lambda: return id(st_win_left).state || id(st_win_right).state;
                  then:
                    - homeassistant.action:
                        action: homeassistant.turn_off
                        data:
                          entity_id: switch.window_light_left_plug_switch, switch.window_light_right_plug_switch_2
                  else:
                    - homeassistant.action:
                        action: homeassistant.turn_on
                        data:
                          entity_id: switch.window_light_left_plug_switch, switch.window_light_right_plug_switch_2
        - button:
            id: btn_sofa
            width: 200
            height: 130
            checkable: true
            widgets:
              - label: { align: CENTER, text: "Sofa", text_font: montserrat_28 }
            on_click:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data:
                    entity_id: light.sofalight
        - button:
            id: btn_win_left
            width: 200
            height: 130
            checkable: true
            widgets:
              - label: { align: CENTER, text: "Window L", text_font: montserrat_28 }
            on_click:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data:
                    entity_id: switch.window_light_left_plug_switch
        - button:
            id: btn_win_right
            width: 200
            height: 130
            checkable: true
            widgets:
              - label: { align: CENTER, text: "Window R", text_font: montserrat_28 }
            on_click:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data:
                    entity_id: switch.window_light_right_plug_switch_2
        - button:
            id: btn_all
            width: 200
            height: 130
            checkable: true
            widgets:
              - label: { align: CENTER, text: "All", text_font: montserrat_28 }
            on_click:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data:
                    entity_id: switch.silicon_labs_ezsp_living_room_lights_group
    - id: screen
      layout:
        type: flex
        flex_flow: column
        flex_align_main: center
        flex_align_cross: center
        pad_row: 24
      on_load:
        - lambda: id(page_select).publish_state("Screen");
      on_swipe_left:
        - lvgl.page.next:
            animation: MOVE_LEFT
            time: 300ms
      on_swipe_right:
        - lvgl.page.previous:
            animation: MOVE_RIGHT
            time: 300ms
      widgets:
        - label: { text: "Screen brightness", text_font: montserrat_28 }
        # Minimum 5% so the slider can't black out the screen with no way back except Home Assistant
        - slider:
            id: sld_brightness
            width: 400
            min_value: 5
            max_value: 100
            value: 100
            # Otherwise dragging the knob also counts as a page swipe, and the page change
            # releases the slider early at the low value where the drag started
            gesture_bubble: false
            on_release:
              - globals.set: { id: dimmed, value: "false" }
              - light.turn_on:
                  id: display_backlight
                  brightness: !lambda return x / 100.0;
